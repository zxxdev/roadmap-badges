# A valid example catalog. CI runs the action on it and checks the counts:
# 2 areas, 2 items that count and 1 dropped.
project: example
areas:
  - id: api
    title: API
    items:
      - id: api.get-user
        title: Get a user
        evidence: junit
      - id: api.export
        title: Export users to CSV
        evidence: junit
        dropped: Replaced by the reports area
  - id: docs
    title: Documentation
    items:
      - id: docs.guide
        title: User guide written
        evidence: manual
        done: true
