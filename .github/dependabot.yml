# Dependabot version updates.
# Version updates wait 7 days after release, matching minimumReleaseAge in
# pnpm-workspace.yaml. Dependabot opens security updates at once, but pnpm will still
# refuse a version younger than 7 days unless an explicit exception is added.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    ignore:
      # typescript-eslint supports TypeScript below 6.1 (see docs/adr/0001).
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      build:
        patterns:
          - "rollup"
          - "@rollup/*"
          - "typescript"
          - "tslib"
      lint-and-format:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "typescript-eslint"
          - "eslint-plugin-*"
          - "prettier"
          - "prettier-plugin-*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
