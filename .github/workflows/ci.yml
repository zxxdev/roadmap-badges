name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Weekly run: new vulnerabilities are disclosed after dependencies are installed.
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, test and bundle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level high

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      # The JUnit report is what the action reads below to compute this
      # repository's own progress.
      - name: Test
        run: pnpm test --reporter=default --reporter=junit --outputFile.junit=reports/junit.xml

      # GitHub runs dist/index.js as it is in the repository. If someone changes
      # src/ and forgets `pnpm bundle`, the published action would not do what
      # the source says: rebuild it here and fail if it differs.
      - name: Check that dist/ matches the source
        run: |
          pnpm bundle
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::error::dist/ is out of date. Run 'pnpm bundle' and commit the result."
            git status --short -- dist
            git diff --stat -- dist
            exit 1
          fi

      # Runs the action from this checkout, exactly as another repository would,
      # on this repository's catalog and the test report written above.
      - name: Compute this repository's progress
        uses: ./
        with:
          reports: reports/junit.xml
          strict: true

      # The badges the step above drew for this repository, to download from the
      # run's page. They will be published on GitHub Pages in a later version.
      - name: Upload this repository's badges
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: badges
          path: roadmap-badges/
          if-no-files-found: error
          retention-days: 14

  action:
    name: Run the action
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The example reports were written by Vitest, Pester and pytest
      # (tests/fixtures/junit/generate.sh); catalog.yml works out the result by
      # hand. The warning about the tag @vitest.gte is expected.
      - name: Run on the example reports from real tools
        id: examples
        uses: ./
        with:
          catalog: tests/fixtures/junit/catalog.yml
          reports: tests/fixtures/junit/*.xml

      # These must fail. continue-on-error keeps the job going so the last
      # step can check that they did; their error annotations are expected.
      - name: Run on an invalid example catalog (expected to fail)
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          catalog: tests/fixtures/catalogs/invalid.yml

      - name: Run with a catalog that does not exist (expected to fail)
        id: missing
        continue-on-error: true
        uses: ./
        with:
          catalog: no-such-file.yml

      - name: Run with a reports pattern that matches nothing (expected to fail)
        id: no-reports
        continue-on-error: true
        uses: ./
        with:
          catalog: tests/fixtures/junit/catalog.yml
          reports: no-such-folder/*.xml

      - name: Run with a misspelt tag in strict mode (expected to fail)
        id: strict
        continue-on-error: true
        uses: ./
        with:
          catalog: tests/fixtures/junit/catalog.yml
          reports: tests/fixtures/junit/*.xml
          strict: true

      - name: Check the results
        env:
          COUNTS: ${{ steps.examples.outputs.areas }}/${{ steps.examples.outputs.items }}/${{ steps.examples.outputs.dropped }}/${{ steps.examples.outputs.done }}/${{ steps.examples.outputs.percent }}
          INVALID: ${{ steps.invalid.outcome }}
          MISSING: ${{ steps.missing.outcome }}
          NO_REPORTS: ${{ steps.no-reports.outcome }}
          STRICT: ${{ steps.strict.outcome }}
        run: |
          test "$COUNTS" = "3/15/1/6/40" || { echo "::error::expected areas/items/dropped/done/percent 3/15/1/6/40, got '$COUNTS'"; exit 1; }
          test "$INVALID" = "failure" || { echo "::error::the invalid catalog should fail, got '$INVALID'"; exit 1; }
          test "$MISSING" = "failure" || { echo "::error::a missing catalog should fail, got '$MISSING'"; exit 1; }
          test "$NO_REPORTS" = "failure" || { echo "::error::a pattern with no reports should fail, got '$NO_REPORTS'"; exit 1; }
          test "$STRICT" = "failure" || { echo "::error::a misspelt tag in strict mode should fail, got '$STRICT'"; exit 1; }
          # The example catalog has three areas: one badge for each and one overall.
          BADGES="$(cd roadmap-badges && LC_ALL=C ls)"
          test "$BADGES" = "$(printf '%s\n' badge-pester.svg badge-pytest.svg badge-vitest.svg badge.svg)" || { echo "::error::expected four badges, got: $BADGES"; exit 1; }
          grep -q 'aria-label="junit-examples progress: 40% (6 of 15 items done)"' roadmap-badges/badge.svg || { echo "::error::the overall badge does not say 40%"; exit 1; }
          echo "All results are right."
