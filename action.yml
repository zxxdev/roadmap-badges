name: Roadmap Badges
description: Compute a project's progress from a feature catalog and its test results, and publish badges.
author: zxxdev

branding:
  icon: bar-chart-2
  color: purple

inputs:
  catalog:
    description: >-
      Path to the feature catalog, relative to the repository root. The step fails if the
      file is missing or not valid.
    required: false
    default: progress.yml
  reports:
    description: >-
      The JUnit XML reports that your tests write: glob patterns relative to the repository
      root, one per line (for example reports/*.xml). Each pattern must match at least one
      file. Needed when the catalog has items proved by tests.
    required: false
    default: ""
  strict:
    description: >-
      Fail the step when a test name has a tag (@id) that matches no item in the catalog,
      instead of warning. Such a tag is usually a misspelt id.
    required: false
    default: "false"
  output:
    description: >-
      Folder for the SVG badges, relative to the repository root: badge.svg for the whole
      catalog and badge-<area id>.svg for each area. Created if needed; files already there
      with other names are left alone. Absolute paths and ".." are refused.
    required: false
    default: roadmap-badges

outputs:
  output:
    description: The folder the badges were written to.
  areas:
    description: Number of areas in the catalog.
  items:
    description: Number of items that count towards the total (dropped items do not).
  dropped:
    description: Number of dropped items.
  done:
    description: Number of items done.
  percent:
    description: >-
      Percentage of items done, rounded down so that 100 means all of them. Empty when there
      is nothing to count.

runs:
  using: node24
  main: dist/index.js
